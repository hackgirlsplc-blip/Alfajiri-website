<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyfade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7EC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="sunfade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F28717" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F28717" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#skyfade)"/>

  <!-- large dawn arcs, echoing the logo -->
  <path d="M 1180 120 A 520 520 0 0 1 1180 920" fill="none" stroke="#F28717" stroke-width="14" stroke-linecap="round" opacity="0.85"/>
  <path d="M 1120 40 A 600 600 0 0 1 1120 1000" fill="none" stroke="#F8C889" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <circle cx="1180" cy="500" r="330" fill="url(#sunfade)"/>

  <!-- abstract network / data nodes over the arcs, representing engineering + data -->
  <g stroke="#0B0B0B" stroke-width="3" opacity="0.75">
    <line x1="760" y1="360" x2="920" y2="300"/>
    <line x1="920" y1="300" x2="1040" y2="420"/>
    <line x1="760" y1="360" x2="840" y2="520"/>
    <line x1="840" y1="520" x2="1040" y2="420"/>
    <line x1="840" y1="520" x2="740" y2="620"/>
    <line x1="1040" y1="420" x2="1160" y2="500"/>
  </g>
  <g>
    <circle cx="760" cy="360" r="10" fill="#0B0B0B"/>
    <circle cx="920" cy="300" r="10" fill="#0B0B0B"/>
    <circle cx="1040" cy="420" r="14" fill="#F28717"/>
    <circle cx="840" cy="520" r="10" fill="#0B0B0B"/>
    <circle cx="740" cy="620" r="10" fill="#0B0B0B"/>
    <circle cx="1160" cy="500" r="10" fill="#0B0B0B"/>
  </g>

  <!-- small code brackets motif, lower left -->
  <g transform="translate(180,650)" opacity="0.9">
    <path d="M0 0 L-36 36 L0 72" fill="none" stroke="#0B0B0B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70 0 L106 36 L70 72" fill="none" stroke="#0B0B0B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="50" y1="-10" x2="20" y2="82" stroke="#F28717" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>